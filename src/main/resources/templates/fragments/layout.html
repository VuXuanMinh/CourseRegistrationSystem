<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config" th:inline="javascript">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "secondary-container": "#9ebbff", "tertiary-fixed": "#dbe3f1", "outline-variant": "#c5c6d0",
                "primary-fixed": "#dae1ff", "surface-tint": "#4d5d8b", "secondary": "#3f5d9b",
                "on-tertiary-container": "#8d95a2", "on-tertiary": "#ffffff", "error-container": "#ffdad6",
                "tertiary-fixed-dim": "#bfc7d4", "on-secondary": "#ffffff", "surface-container-low": "#eff4ff",
                "error": "#ba1a1a", "on-background": "#0b1c30", "primary": "#021541",
                "on-primary-fixed-variant": "#354572", "on-secondary-container": "#2a4986", "outline": "#757680",
                "inverse-on-surface": "#eaf1ff", "tertiary-container": "#262e38", "surface-container-lowest": "#ffffff",
                "surface-container-high": "#dce9ff", "on-secondary-fixed": "#001a43", "on-error-container": "#93000a",
                "tertiary": "#111923", "on-primary-fixed": "#051944", "on-tertiary-fixed": "#141c26",
                "surface": "#f8f9ff", "primary-container": "#1a2b56", "on-tertiary-fixed-variant": "#3f4752",
                "on-secondary-fixed-variant": "#254582", "background": "#f8f9ff", "surface-variant": "#d3e4fe",
                "surface-container-highest": "#d3e4fe", "inverse-surface": "#213145", "secondary-fixed-dim": "#afc6ff",
                "inverse-primary": "#b5c5f9", "surface-bright": "#f8f9ff", "on-primary-container": "#8393c5",
                "secondary-fixed": "#d9e2ff", "on-surface-variant": "#45464f", "on-primary": "#ffffff",
                "surface-dim": "#cbdbf5", "primary-fixed-dim": "#b5c5f9", "surface-container": "#e5eeff",
                "on-surface": "#0b1c30", "on-error": "#ffffff"
              },
              "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
              "spacing": { "xl": "32px", "sm": "12px", "lg": "24px", "card_padding": "20px", "xs": "8px", "base": "4px", "md": "16px", "sidebar_width": "280px" },
              "fontFamily": { "display-sm": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"] },
              "fontSize": { "display-sm": ["24px", {"lineHeight": "32px", "fontWeight": "700"}], "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}], "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}], "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "600"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}] }
            }
          }
        }
    </script>
    <style> body { background-color: #DBE5F5; } .card-shadow { box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05); } </style>
</head>
<body>
    <nav th:fragment="sidebar" class="fixed left-0 top-0 h-screen w-sidebar_width bg-surface-container-lowest border-r border-outline-variant z-20 flex flex-col">
        <div class="p-lg border-b border-outline-variant">
            <h1 class="font-display-sm text-display-sm text-primary mb-xs">Quản lý đào tạo</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Hệ thống quản trị</p>
        </div>
        
        <div class="flex flex-col gap-base p-md flex-1 overflow-y-auto" id="sidebar-menu">
            <a id="menu-info" class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container px-md py-sm rounded-lg scale-98 active:opacity-80 transition-all font-label-md" th:href="@{/staff/students}">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">info</span> Quản lý thông-tin
            </a>
            <a id="menu-reg" class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container px-md py-sm rounded-lg scale-98 active:opacity-80 transition-all font-label-md" th:href="@{/staff/registration/courses}">
                <span class="material-symbols-outlined">app_registration</span> Quản lý đăng ký
            </a>
            <a id="menu-tuition" class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container px-md py-sm rounded-lg hover:bg-surface-container-high scale-98 active:opacity-80 transition-all font-label-md" th:href="@{/staff/tuitions}">
                <span class="material-symbols-outlined">payments</span> Quản lý học phí
            </a>
            
            <a id="menu-account" class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container px-md py-sm rounded-lg hover:bg-surface-container-high scale-98 active:opacity-80 transition-all font-label-md" th:href="@{/staff/accounts}">
                <span class="material-symbols-outlined">manage_accounts</span> Quản lý tài khoản
            </a>

            <a id="menu-log" class="flex items-center gap-sm text-on-surface-variant hover:bg-surface-container px-md py-sm rounded-lg hover:bg-surface-container-high scale-98 active:opacity-80 transition-all font-label-md" th:href="@{/staff/logs}">
                <span class="material-symbols-outlined">history</span> Nhật ký hệ thống
            </a>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const currentUrl = window.location.pathname;
                const infoMenu = document.getElementById("menu-info");
                const regMenu = document.getElementById("menu-reg");
                const tuitionMenu = document.getElementById("menu-tuition"); 
                const accountMenu = document.getElementById("menu-account"); 
                const logMenu = document.getElementById("menu-log"); // Thêm menu log

                const activeClasses = ["text-on-primary-container", "bg-primary-container", "font-bold"];
                const inactiveClasses = ["text-on-surface-variant", "hover:bg-surface-container", "hover:bg-surface-container-high"];

                // Xóa class inactive và thêm class active dựa vào URL
                if (currentUrl.includes("/registration/")) {
                    regMenu.classList.remove(...inactiveClasses);
                    regMenu.classList.add(...activeClasses);
                } else if (currentUrl.includes("/staff/tuitions")) {
                    tuitionMenu.classList.remove(...inactiveClasses);
                    tuitionMenu.classList.add(...activeClasses);
                } else if (currentUrl.includes("/staff/accounts")) { 
                    accountMenu.classList.remove(...inactiveClasses);
                    accountMenu.classList.add(...activeClasses);
                } else if (currentUrl.includes("/staff/logs")) {
                    // THÊM ĐIỀU KIỆN CHO NHẬT KÝ HỆ THỐNG
                    logMenu.classList.remove(...inactiveClasses);
                    logMenu.classList.add(...activeClasses);
                } else if (currentUrl.includes("/staff/students") || currentUrl.includes("/staff/faculties") || currentUrl.includes("/staff/majors") || currentUrl.includes("/staff/lecturers")) {
                    infoMenu.classList.remove(...inactiveClasses);
                    infoMenu.classList.add(...activeClasses);
                }
            });
        </script>

        <div class="p-md mt-auto border-t border-outline-variant">
            <div class="flex items-center gap-sm">
                <div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center font-bold text-primary" th:text="${session.loggedInUser != null ? #strings.substring(session.loggedInUser.username, 0, 1).toUpperCase() : 'A'}">A</div>
                <div>
                    <div class="font-label-md text-on-surface" th:text="${session.loggedInUser != null ? session.loggedInUser.username : 'Admin'}">Nguyễn Văn A</div>
                    <div class="font-body-sm text-on-surface-variant" th:text="${session.loggedInUser != null ? session.loggedInUser.role : 'Quản trị'}">Admin</div>
                </div>
            </div>
        </div>
    </nav>

    <header th:fragment="header" class="fixed top-0 right-0 w-[calc(100%-theme(spacing.sidebar_width))] z-10 bg-surface-bright border-b border-outline-variant shadow-sm flex items-center justify-between px-lg py-sm h-16 ml-sidebar_width">
        <div class="flex-1 flex items-center gap-lg">
            <div class="relative w-96 max-w-full focus-within:ring-2 focus-within:ring-primary rounded-lg">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
                <input class="w-full bg-surface border border-outline-variant text-on-surface pl-10 pr-4 py-2 rounded-lg font-body-md focus:outline-none" placeholder="Tìm kiếm nhanh..." type="text"/>
            </div>
        </div>
        <div class="flex items-center gap-sm">
            <button class="p-2 rounded-full text-on-surface-variant hover:text-primary transition-all"><span class="material-symbols-outlined">notifications</span></button>
            <button class="p-2 rounded-full text-on-surface-variant hover:text-primary transition-all"><span class="material-symbols-outlined">help</span></button>
            <button class="p-2 rounded-full text-on-surface-variant hover:text-primary transition-all"><span class="material-symbols-outlined">settings</span></button>
        </div>
    </header>
</body>
</html>
