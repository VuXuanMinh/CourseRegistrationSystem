<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="font-body-md text-on-surface antialiased bg-background min-h-screen">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div th:replace="~{fragments/layout :: header}"></div>

    <main class="ml-sidebar_width pt-[88px] p-lg">
        <div class="flex items-center justify-between mb-md">
            <div>
                <h2 class="font-display-sm text-on-surface">Quản lý Môn học</h2>
                <p class="font-body-md text-on-surface-variant mt-xs">Thiết lập danh mục môn học nền tảng cho hệ thống.</p>
            </div>
            <button onclick="openModal(false)" class="bg-primary text-white px-lg py-2 rounded-lg font-label-md flex items-center gap-xs shadow-md hover:bg-primary-container transition-all">
                <span class="material-symbols-outlined">add</span> Thêm Môn học
            </button>
        </div>

        <div class="flex border-b border-outline-variant mb-lg overflow-x-auto">
            <a th:href="@{/staff/registration/courses}" class="px-md py-sm font-label-md text-primary border-b-2 border-primary whitespace-nowrap">Môn học</a>
            <a th:href="@{/staff/registration/class-sections}" class="px-md py-sm font-label-md text-on-surface-variant border-b-2 border-transparent hover:text-primary whitespace-nowrap">Lớp học phần</a>
            <a th:href="@{/staff/registration/semesters}" class="px-md py-sm font-label-md text-on-surface-variant border-b-2 border-transparent hover:text-primary whitespace-nowrap">Học kỳ</a>
            <a th:href="@{/staff/registration/plans}" class="px-md py-sm font-label-md text-on-surface-variant border-b-2 border-transparent hover:text-primary whitespace-nowrap">Đợt đăng ký</a>
            <a th:href="@{/staff/registration/results}" class="px-md py-sm font-label-md text-on-surface-variant border-b-2 border-transparent hover:text-primary whitespace-nowrap">Kết quả ĐK</a>
        </div>

        <div class="bg-surface-container-lowest rounded-xl border border-outline-variant card-shadow overflow-hidden">
            <table class="w-full text-left border-collapse table-auto">
                <thead>
                    <tr class="bg-surface-container border-b border-outline-variant">
                        <th class="p-md text-on-surface-variant w-16 text-center">STT</th>
                        <th class="p-md text-on-surface-variant text-left">Mã Môn</th>
                        <th class="p-md text-on-surface-variant text-left">Tên Môn Học</th>
                        <th class="p-md text-on-surface-variant text-center">Tín chỉ</th>
                        <th class="p-md text-on-surface-variant text-center">Loại môn</th>
                        <th class="p-md text-on-surface-variant text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-outline-variant/50">
                    <tr th:each="course, iter : ${courses}" class="hover:bg-surface-container-lowest transition-colors">
                        <td class="p-md text-center text-on-surface-variant" th:text="${iter.count}">1</td>
                        
                        <td class="p-md font-bold text-[#021541]" th:text="${course.courseCode}">IT3040</td>
                        
                        <td class="p-md font-medium text-on-surface" th:text="${course.courseName}">Cấu trúc dữ liệu và giải thuật</td>
                        
                        <td class="p-md text-center font-bold" th:text="${course.credits}">3</td>
                        
                        <td class="p-md text-center">
                            <span class="px-2 py-1 rounded bg-blue-100 text-blue-800 text-xs font-bold" th:text="${course.courseType}">Bắt buộc</span>
                        </td>
                        <td class="p-md text-right">
                            <div class="flex justify-end gap-2">
                                <button type="button" 
                                        th:data-id="${course.id}" 
                                        th:data-code="${course.courseCode}" 
                                        th:data-name="${course.courseName}" 
                                        th:data-credits="${course.credits}" 
                                        th:data-type="${course.courseType}" 
                                        onclick="editCourse(this)" 
                                        class="p-1.5 hover:text-primary"><span class="material-symbols-outlined">edit</span></button>
                                <a th:href="@{/staff/registration/courses/delete(id=${course.id})}" onclick="return confirm('Xóa môn học này?')" class="p-1.5 hover:text-error"><span class="material-symbols-outlined">delete</span></a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="6" class="p-10 text-center text-gray-500">Chưa có môn học nào trong cơ sở dữ liệu.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="crudModal" style="display: none;" class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/60" onclick="closeModal()"></div>
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 z-50 overflow-hidden relative">
            <div class="p-6 border-b flex justify-between items-center bg-gray-50">
                <h3 class="text-xl font-bold text-primary" id="modalTitle">Thêm Môn học</h3>
                <button onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
            </div>
            <form th:action="@{/staff/registration/courses/save}" method="post" class="p-6">
                <input type="hidden" name="id" id="formId"/>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Mã môn học</label>
                        <input type="text" name="courseCode" id="c_code" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-primary" required/>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Tên môn học</label>
                        <input type="text" name="courseName" id="c_name" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-primary" required/>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Số tín chỉ</label>
                            <input type="number" name="credits" id="c_credits" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-primary" required/>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Loại môn</label>
                            <select name="courseType" id="c_type" class="w-full border p-2 rounded-lg focus:ring-2 focus:ring-primary">
                                <option value="Bắt buộc">Bắt buộc</option>
                                <option value="Tự chọn">Tự chọn</option>
                                <option value="Thực tập">Thực tập</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6 pt-6 border-t">
                    <button type="button" onclick="closeModal()" class="px-6 py-2 border rounded-lg hover:bg-gray-50">Hủy</button>
                    <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg font-bold shadow-md">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function closeModal() { document.getElementById('crudModal').style.display = 'none'; }
        
        function openModal(isEdit) { 
            document.getElementById('crudModal').style.display = 'flex'; 
            document.getElementById('modalTitle').innerText = isEdit ? "Cập nhật Môn học" : "Thêm Môn học";
            if(!isEdit) { 
                document.getElementById('formId').value = ""; 
                document.querySelector('form').reset(); 
            } 
        }

        function editCourse(btn) {
            openModal(true);
            document.getElementById('formId').value = btn.getAttribute('data-id');
            document.getElementById('c_code').value = btn.getAttribute('data-code');
            document.getElementById('c_name').value = btn.getAttribute('data-name');
            document.getElementById('c_credits').value = btn.getAttribute('data-credits');
            document.getElementById('c_type').value = btn.getAttribute('data-type');
        }
    </script>
</body>
</html>
